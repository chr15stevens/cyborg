[project]
name = "cyborg"
version = "0.1.0"
description = "An MCP server that owns a project registry and ranks proposed work by merged value per minute of human review."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
cyborg-mcp = "cyborg.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyborg"]
