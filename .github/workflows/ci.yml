name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails rather than re-resolving, so a stale uv.lock is a CI
      # failure here instead of a surprise on someone else's machine.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
